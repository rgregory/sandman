<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Three kinds of sandbox layer, and why they don't nest</title>
  <style>
    .bg{fill:#ffffff}.panel{fill:#f6f8fa}.ink{fill:#1f2328}.muted{fill:#59636e}
    .line{stroke:#d1d9e0}.box{fill:#ffffff;stroke:#afb8c1}
    .green{fill:#1a7f37}.sgreen{stroke:#1a7f37}.tgreen{fill:#dafbe1}
    .orange{fill:#bc4c00}.sorange{stroke:#bc4c00}
    .indigo{fill:#5034c4}.sindigo{stroke:#5034c4}.tindigo{fill:#ebe5ff}
    .blue{fill:#0969da}.sblue{stroke:#0969da}.tblue{fill:#ddf4ff}
    .red{fill:#cf222e}.sred{stroke:#cf222e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.panel{fill:#161b22}.ink{fill:#e6edf3}.muted{fill:#9198a1}
      .line{stroke:#3d444d}.box{fill:#0d1117;stroke:#59636e}
      .green{fill:#3fb950}.sgreen{stroke:#3fb950}.tgreen{fill:#12261a}
      .orange{fill:#f0883e}.sorange{stroke:#f0883e}
      .indigo{fill:#a371f7}.sindigo{stroke:#a371f7}.tindigo{fill:#221a3d}
      .blue{fill:#4493f8}.sblue{stroke:#4493f8}.tblue{fill:#0c2645}
      .red{fill:#f85149}.sred{stroke:#f85149}
    }
    text{font-size:13px}.h{font-size:17px;font-weight:600}.s{font-size:12px}.pill{font-size:11px;font-weight:600}
    .lbl{font-size:12px;font-weight:500}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  </style>
  <rect class="bg" width="960" height="480" rx="12"/>

  <!-- ===== 1 App Sandbox ===== -->
  <g transform="translate(15,0)">
    <text class="h ink" x="10" y="32">App Sandbox</text>
    <text class="s muted" x="10" y="52">Set by the developer</text>
    <rect x="10" y="78" width="280" height="214" rx="16" class="tgreen sgreen" stroke-width="3"/>
    <rect x="95" y="68" width="110" height="20" rx="10" class="bg sgreen" stroke-width="1.5"/>
    <text class="pill green" x="150" y="82" text-anchor="middle">APP SANDBOX</text>
    <rect x="30" y="104" width="240" height="46" rx="8" class="box" stroke-width="1.2"/>
    <text class="lbl ink" x="150" y="132" text-anchor="middle">Main process</text>
    <g class="box" stroke-width="1.2">
      <rect x="30" y="170" width="52" height="56" rx="7"/><rect x="92" y="170" width="52" height="56" rx="7"/>
      <rect x="154" y="170" width="52" height="56" rx="7"/><rect x="216" y="170" width="54" height="56" rx="7"/>
    </g>
    <g class="s muted" text-anchor="middle">
      <text x="56" y="202">Helper</text><text x="118" y="202">Helper</text><text x="180" y="202">Helper</text><text x="243" y="202">XPC</text>
    </g>
    <text class="s muted" x="30" y="274">One sandbox around everything</text>
    <text class="ink" x="10" y="322">The developer opts in with the App</text>
    <text class="ink" x="10" y="342">Sandbox entitlement. The main process</text>
    <text class="ink" x="10" y="362">and everything it starts share one</text>
    <text class="ink" x="10" y="380">profile.</text>
  </g>

  <!-- ===== 2 Its own sandboxes ===== -->
  <g transform="translate(330,0)">
    <text class="h ink" x="10" y="32">Its own sandboxes</text>
    <text class="s muted" x="10" y="52">Set by the app as it runs</text>
    <rect x="10" y="78" width="280" height="214" rx="16" fill="none" class="line" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="90" y="68" width="120" height="20" rx="10" class="bg sorange" stroke-width="1.5"/>
    <text class="pill orange" x="150" y="82" text-anchor="middle">NO APP SANDBOX</text>
    <rect x="30" y="104" width="240" height="46" rx="8" class="box sorange" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text class="lbl ink" x="150" y="126" text-anchor="middle">Main process</text>
    <text class="s orange" x="150" y="142" text-anchor="middle">open · your full permissions</text>
    <g class="tindigo sindigo" stroke-width="2.5">
      <rect x="30" y="170" width="52" height="56" rx="7"/><rect x="92" y="170" width="52" height="56" rx="7"/>
      <rect x="154" y="170" width="52" height="56" rx="7"/><rect x="216" y="170" width="54" height="56" rx="7"/>
    </g>
    <g class="indigo" text-anchor="middle" font-weight="600" font-size="10.5">
      <text x="56" y="202">Pages</text><text x="118" y="202">GPU</text><text x="180" y="202">Net</text><text x="243" y="202">Utility</text>
    </g>
    <text class="s indigo" x="30" y="248">▲ each locked in its own profile</text>
    <text class="s muted" x="30" y="274">Chromium, Electron, CEF, Firefox</text>
    <text class="ink" x="10" y="322">Each helper locks itself in as it starts.</text>
    <text class="ink" x="10" y="342">Web pages get the strictest box: no files,</text>
    <text class="ink" x="10" y="362">no network. The main process stays open,</text>
    <text class="ink" x="10" y="380">so Artemis shows these as "N sandboxes".</text>
  </g>

  <!-- ===== 3 Artemis's seatbelt ===== -->
  <g transform="translate(645,0)">
    <text class="h ink" x="10" y="32">Artemis's seatbelt</text>
    <text class="s muted" x="10" y="52">Set by you, by managing the app</text>
    <rect x="4" y="72" width="292" height="226" rx="20" class="tblue sblue" stroke-width="3"/>
    <rect x="16" y="86" width="268" height="198" rx="12" class="bg line" stroke-width="1.2" stroke-dasharray="6 5"/>
    <rect x="85" y="62" width="130" height="20" rx="10" class="bg sblue" stroke-width="1.5"/>
    <text class="pill blue" x="150" y="76" text-anchor="middle">ARTEMIS SEATBELT</text>
    <rect x="30" y="104" width="240" height="46" rx="8" class="box" stroke-width="1.2"/>
    <text class="lbl ink" x="150" y="132" text-anchor="middle">Main process</text>
    <g class="box" stroke-width="1.2">
      <rect x="30" y="170" width="52" height="56" rx="7"/><rect x="92" y="170" width="52" height="56" rx="7"/>
      <rect x="154" y="170" width="52" height="56" rx="7"/><rect x="216" y="170" width="54" height="56" rx="7"/>
    </g>
    <g class="s muted" text-anchor="middle">
      <text x="56" y="202">Helper</text><text x="118" y="202">Helper</text><text x="180" y="202">Helper</text><text x="243" y="202">Helper</text>
    </g>
    <text class="s muted" x="30" y="268">The app itself is not modified</text>
    <text class="ink" x="10" y="322">One profile wrapped around the whole</text>
    <text class="ink" x="10" y="342">app from outside. It keeps the app from</text>
    <text class="ink" x="10" y="362">credentials, mail and launch agents,</text>
    <text class="ink" x="10" y="380">and logs every blocked attempt.</text>
  </g>

  <!-- ===== They don't nest ===== -->
  <rect x="15" y="402" width="930" height="64" rx="10" class="panel"/>
  <g transform="translate(35,412)">
    <rect x="0" y="0" width="74" height="44" rx="9" class="tblue sblue" stroke-width="2.5"/>
    <rect x="14" y="10" width="46" height="24" rx="5" class="tindigo sindigo" stroke-width="2.5"/>
    <circle cx="66" cy="8" r="10" class="red"/>
    <path d="M61 3 L71 13 M71 3 L61 13" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text class="ink" x="130" y="428"><tspan font-weight="600">They don't nest.</tspan> All three are Seatbelt, and a process already in a sandbox can't enter another.</text>
  <text class="ink" x="130" y="450">macOS refuses with <tspan class="mono red">forbidden-sandbox-reinit</tspan>, so a seatbelt only fits once the app's own sandboxes come off.</text>
</svg>
