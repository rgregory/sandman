<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2B5E"/>
      <stop offset="1" stop-color="#0B8A8F"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A4A8C"/>
      <stop offset="1" stop-color="#1E2752"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE3A4"/>
      <stop offset="1" stop-color="#EDC56F"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001018" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="inner"><polygon points="512,412 724,530 512,648 300,530"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="#1B2B5E" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <!-- moon, Z's, stars -->
  <path d="M300 214 a64 64 0 1 0 56 96 a52 52 0 1 1 -56 -96z" fill="#FFF3C4"/>
  <g fill="none" stroke="#FFF3C4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M344 176 h22 l-22 24 h22" stroke-width="7" opacity=".85"/>
    <path d="M380 138 h15 l-15 17 h15" stroke-width="5" opacity=".6"/>
  </g>
  <circle cx="742" cy="206" r="5" fill="#FFF3C4" opacity=".6"/>
  <circle cx="800" cy="300" r="4" fill="#FFF3C4" opacity=".5"/>

  <!-- the sandman: hooded, a soft glowing visor -->
  <path d="M512 160 C 446 160 412 220 410 284 L 404 338 C 362 352 334 382 324 440 L 312 520 L 712 520 L 700 440 C 690 382 662 352 620 338 L 614 284 C 612 220 578 160 512 160 Z" fill="url(#coat)"/>
  <path d="M512 160 C 446 160 412 220 410 284 L 404 338 M512 160 C 578 160 612 220 614 284 L 620 338" fill="none" stroke="#5A6BB0" stroke-width="5" opacity=".7"/>
  <ellipse cx="512" cy="284" rx="58" ry="68" fill="#0E1430"/>
  <rect x="466" y="270" width="92" height="16" rx="8" fill="#7FF3FF" filter="url(#glow)" opacity=".95"/>

  <!-- arm and hourglass -->
  <path d="M612 352 C 652 354 680 334 694 306 L 716 318 C 702 354 668 382 622 390 Z" fill="url(#coat)"/>
  <g transform="translate(704,252)">
    <path d="M-20 0 H20 L4 26 L20 52 H-20 L-4 26 Z" fill="#FFF7DC" stroke="#C98A3A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-12 6 H12 L2 22 H-2 Z" fill="#EDC56F"/>
    <path d="M-10 48 H10 L0 38 Z" fill="#EDC56F"/>
  </g>
  <!-- sand drifting down -->
  <g fill="#FBE3A4">
    <circle cx="704" cy="322" r="4"/><circle cx="700" cy="348" r="3.5" opacity=".9"/><circle cx="706" cy="374" r="4" opacity=".85"/>
    <circle cx="696" cy="400" r="3" opacity=".8"/><circle cx="702" cy="426" r="4" opacity=".75"/><circle cx="692" cy="452" r="3.5" opacity=".7"/>
    <circle cx="698" cy="478" r="3" opacity=".65"/><circle cx="686" cy="502" r="3.5" opacity=".6"/>
  </g>

  <!-- the sandbox -->
  <g filter="url(#soft)">
    <polygon points="212,530 512,698 512,790 212,622" fill="#B5662B"/>
    <polygon points="512,698 812,530 812,622 512,790" fill="#8E4A1C"/>
    <polygon points="512,362 812,530 512,698 212,530" fill="#E39A4E"/>
    <polygon points="512,412 724,530 512,648 300,530" fill="#7A3F18"/>
    <polygon points="512,412 300,530 300,570 512,452" fill="#9A5322" clip-path="url(#inner)"/>
    <polygon points="512,446 724,564 512,682 300,564" fill="url(#sand)" clip-path="url(#inner)"/>
  </g>
  <!-- a little sparkle where the sand lands -->
  <g fill="#FFFFFF" opacity=".85">
    <path d="M676 560 l4 -10 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 z"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
