<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2B5E"/>
      <stop offset="1" stop-color="#0B8A8F"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE3A4"/>
      <stop offset="1" stop-color="#EDC56F"/>
    </linearGradient>
    <linearGradient id="mound" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFEDBD"/>
      <stop offset="1" stop-color="#E3B55A"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A94A6"/>
      <stop offset=".18" stop-color="#E9EDF3"/>
      <stop offset=".45" stop-color="#C3CBD8"/>
      <stop offset=".7" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#7C8597"/>
    </linearGradient>
    <linearGradient id="chromeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B5E"/>
      <stop offset="1" stop-color="#D6342A"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#262B38"/>
      <stop offset=".5" stop-color="#454E63"/>
      <stop offset="1" stop-color="#262B38"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001018" flood-opacity="0.45"/>
    </filter>
    <filter id="lift" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="6" dy="10" stdDeviation="10" flood-color="#2A1606" flood-opacity="0.35"/>
    </filter>
    <clipPath id="inner"><polygon points="512,412 724,530 512,648 300,530"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="#1B2B5E" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <!-- moon, Z's, stars -->
  <path d="M300 214 a64 64 0 1 0 56 96 a52 52 0 1 1 -56 -96z" fill="#FFF3C4"/>
  <g fill="none" stroke="#FFF3C4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M344 176 h22 l-22 24 h22" stroke-width="7" opacity=".85"/>
    <path d="M380 138 h15 l-15 17 h15" stroke-width="5" opacity=".6"/>
  </g>
  <circle cx="742" cy="206" r="5" fill="#FFF3C4" opacity=".6"/>
  <circle cx="800" cy="300" r="4" fill="#FFF3C4" opacity=".5"/>
  <circle cx="690" cy="160" r="3.5" fill="#FFF3C4" opacity=".45"/>

  <!-- the sandbox -->
  <g filter="url(#soft)">
    <polygon points="212,530 512,698 512,790 212,622" fill="#B5662B"/>
    <polygon points="512,698 812,530 812,622 512,790" fill="#8E4A1C"/>
    <polygon points="512,362 812,530 512,698 212,530" fill="#E39A4E"/>
    <polygon points="512,412 724,530 512,648 300,530" fill="#7A3F18"/>
    <polygon points="512,412 300,530 300,570 512,452" fill="#9A5322" clip-path="url(#inner)"/>
    <polygon points="512,446 724,564 512,682 300,564" fill="url(#sand)" clip-path="url(#inner)"/>
  </g>

  <!-- seatbelt buckle planted in the sand -->
  <g transform="rotate(-8 512 470)" filter="url(#lift)">
    <!-- webbing running down into the sand -->
    <rect x="474" y="430" width="76" height="120" fill="url(#strap)"/>
    <g stroke="#5D677D" stroke-width="2" opacity=".6">
      <path d="M484 430 V550 M540 430 V550"/>
    </g>
    <!-- buckle body -->
    <rect x="432" y="214" width="160" height="236" rx="34" fill="url(#chrome)"/>
    <rect x="432" y="214" width="160" height="90" rx="34" fill="url(#chromeTop)"/>
    <rect x="432" y="214" width="160" height="236" rx="34" fill="none" stroke="#5E6779" stroke-width="3"/>
    <!-- release button -->
    <rect x="466" y="250" width="92" height="64" rx="14" fill="url(#button)"/>
    <rect x="478" y="258" width="68" height="14" rx="7" fill="#FFFFFF" opacity=".35"/>
    <!-- tongue slot -->
    <rect x="456" y="350" width="112" height="22" rx="11" fill="#3A4252"/>
    <rect x="456" y="350" width="112" height="8" rx="4" fill="#1E232E"/>
    <!-- collar where the webbing enters -->
    <rect x="462" y="420" width="100" height="26" rx="8" fill="#9AA3B3"/>
  </g>

  <!-- sand heaped around the base -->
  <path d="M392 566 C 420 500 468 486 512 488 C 560 490 604 506 632 566 C 594 598 430 598 392 566 Z" fill="url(#mound)"/>
  <path d="M414 562 C 440 520 474 506 506 504" fill="none" stroke="#FFF7DC" stroke-width="8" stroke-linecap="round" opacity=".7"/>
  <g fill="#E3B55A" opacity=".8">
    <circle cx="372" cy="590" r="5"/><circle cx="650" cy="586" r="4"/><circle cx="620" cy="608" r="3"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
