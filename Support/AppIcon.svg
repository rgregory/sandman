<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A1F"/>
      <stop offset=".6" stop-color="#1A0B33"/>
      <stop offset="1" stop-color="#2A0A3D"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2D52"/>
      <stop offset="1" stop-color="#121329"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#FF5FA2"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1C3C"/><stop offset="1" stop-color="#101026"/>
    </linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14142E"/><stop offset="1" stop-color="#0A0A1C"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="plate"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <clipPath id="inner"><polygon points="512,412 724,530 512,648 300,530"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="#0A0A1F" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <g clip-path="url(#plate)">
    <!-- neon grid floor -->
    <g stroke="#FF2E97" stroke-width="2" opacity=".28">
      <path d="M100 760 H924 M100 812 H924 M100 870 H924"/>
      <path d="M512 700 L200 924 M512 700 L360 924 M512 700 L512 924 M512 700 L664 924 M512 700 L824 924"/>
    </g>
    <!-- city skyline -->
    <g fill="#160F30">
      <rect x="120" y="470" width="60" height="300"/><rect x="190" y="420" width="44" height="350"/>
      <rect x="800" y="440" width="54" height="330"/><rect x="860" y="500" width="60" height="270"/>
    </g>
    <g fill="#00E5FF" opacity=".55">
      <rect x="132" y="500" width="8" height="5"/><rect x="152" y="530" width="8" height="5"/><rect x="200" y="460" width="8" height="5"/>
      <rect x="214" y="520" width="8" height="5"/><rect x="814" y="480" width="8" height="5"/><rect x="832" y="540" width="8" height="5"/>
      <rect x="876" y="540" width="8" height="5"/>
    </g>
  </g>

  <!-- neon crescent and drifting Z's -->
  <path d="M300 214 a64 64 0 1 0 56 96 a52 52 0 1 1 -56 -96z" fill="none" stroke="#00E5FF" stroke-width="8" filter="url(#glow)"/>
  <g fill="none" stroke="#00E5FF" stroke-linecap="square" filter="url(#glow)" opacity=".85">
    <path d="M344 176 h24 l-24 26 h24" stroke-width="6"/>
    <path d="M380 138 h17 l-17 19 h17" stroke-width="4.5"/>
  </g>
  <g fill="#FFFFFF" opacity=".7"><rect x="740" y="200" width="5" height="5"/><rect x="790" y="260" width="4" height="4"/><rect x="250" y="380" width="4" height="4"/></g>

  <!-- the sandman: a hooded netrunner -->
  <g filter="url(#shadow)">
    <path d="M512 150 C 440 150 404 214 402 282 L 396 336 C 352 350 322 380 312 440 L 300 520 L 724 520 L 712 440 C 702 380 672 350 628 336 L 622 282 C 620 214 584 150 512 150 Z" fill="url(#coat)"/>
  </g>
  <!-- hood trim -->
  <path d="M512 150 C 440 150 404 214 402 282 L 396 336" fill="none" stroke="#FF2E97" stroke-width="5" filter="url(#glow)"/>
  <path d="M512 150 C 584 150 620 214 622 282 L 628 336" fill="none" stroke="#FF2E97" stroke-width="5" filter="url(#glow)"/>
  <!-- face in shadow, glowing visor -->
  <ellipse cx="512" cy="278" rx="62" ry="74" fill="#05050F"/>
  <rect x="460" y="262" width="104" height="20" rx="10" fill="#00E5FF" filter="url(#glowBig)"/>
  <rect x="478" y="268" width="30" height="8" rx="4" fill="#E9FEFF"/>
  <!-- coat seam and circuit lines -->
  <path d="M512 352 V520" stroke="#00E5FF" stroke-width="3" opacity=".7"/>
  <path d="M470 380 v40 h-24 v40 M554 380 v40 h24 v40" fill="none" stroke="#00E5FF" stroke-width="3" opacity=".45"/>
  <circle cx="446" cy="460" r="5" fill="#00E5FF" opacity=".7"/><circle cx="578" cy="460" r="5" fill="#00E5FF" opacity=".7"/>

  <!-- arm reaching out with a glowing hourglass -->
  <path d="M620 350 C 660 352 690 330 704 300 L 726 312 C 712 350 676 380 630 388 Z" fill="url(#coat)"/>
  <path d="M630 388 C 676 380 712 350 726 312" fill="none" stroke="#FF2E97" stroke-width="4" filter="url(#glow)"/>
  <path d="M620 350 C 660 352 690 330 704 300" fill="none" stroke="#FF2E97" stroke-width="3" opacity=".6"/>
  <g filter="url(#glow)"><g transform="translate(712,252)">
    <path d="M-20 0 H20 L4 26 L20 52 H-20 L-4 26 Z" fill="#0A0A1F" stroke="#FFD27A" stroke-width="4"/>
    <path d="M-12 6 H12 L2 22 H-2 Z" fill="#FFD27A"/>
    <path d="M-10 48 H10 L0 38 Z" fill="#FF5FA2"/>
  </g></g>
  <!-- sand falling into the box -->
  <g fill="url(#sand)" filter="url(#glow)">
    <circle cx="712" cy="322" r="4"/><circle cx="708" cy="346" r="3.5"/><circle cx="714" cy="370" r="4"/>
    <circle cx="704" cy="396" r="3"/><circle cx="710" cy="420" r="4"/><circle cx="700" cy="446" r="3.5"/>
    <circle cx="706" cy="472" r="3"/><circle cx="694" cy="498" r="4"/>
  </g>

  <!-- the sandbox, neon-edged -->
  <polygon points="212,530 512,698 512,790 212,622" fill="url(#wallL)"/>
  <polygon points="512,698 812,530 812,622 512,790" fill="url(#wallR)"/>
  <polygon points="512,362 812,530 512,698 212,530" fill="#191936"/>
  <polygon points="512,412 724,530 512,648 300,530" fill="#07071A"/>
  <polygon points="512,452 724,570 512,688 300,570" fill="url(#sand)" clip-path="url(#inner)" opacity=".95"/>
  <g fill="none" stroke="#00E5FF" stroke-width="5" stroke-linejoin="round" filter="url(#glow)">
    <polygon points="512,362 812,530 512,698 212,530"/>
    <path d="M212 530 V622 L512 790 L812 622 V530 M512 698 V790"/>
  </g>
  <polygon points="512,412 724,530 512,648 300,530" fill="none" stroke="#FF2E97" stroke-width="3" opacity=".8"/>
  <!-- sand sparkles -->
  <g fill="#FFFFFF" opacity=".85">
    <rect x="560" y="560" width="5" height="5"/><rect x="470" y="600" width="4" height="4"/><rect x="640" y="540" width="4" height="4"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
